[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groma"
version = "0.9.0"
description = "Groma : fonctions pures de l'inventaire forestier par vidéo (numérotation, géoréférencement, cercles, houppiers, rapprochement)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "shapely>=2.2.0",
]

[project.optional-dependencies]
geo = ["pyproj>=3.7.2", "rasterio>=1.4.4", "pyogrio>=0.13.0", "geopandas>=1.2.0"]
dev = ["pytest>=9.1.1", "groma[geo]"]

[project.scripts]
groma-preparer = "groma.preparer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groma = ["donnees/*.json", "donnees/*.sql", "donnees/*.COF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
