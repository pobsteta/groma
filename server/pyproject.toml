[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groma-server"
version = "2026.11.4"
description = "Groma : serveur de calcul définitif (API, file de tâches, pipeline 3D)."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "groma[geo]",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "opencv-contrib-python-headless>=4.9",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
groma-worker = "groma_server.worker:main"
groma-cibles = "groma_server.planche_cibles:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
