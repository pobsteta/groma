name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "core[dev]" -e "server[dev]"
      - run: pytest core server benchmark

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle :groma-core:test
        working-directory: android

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pobsteta/nemeton
          path: nemeton-src
      - uses: r-lib/actions/setup-r@v2
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sf, any::jsonlite, any::testthat, any::cli, any::rlang
      - name: Numérotation (cas communs)
        run: GROMA_FIXTURES=$PWD/fixtures/numerotation Rscript -e 'source("briefs/vers-nemeton/R/numerotation.R"); r <- as.data.frame(testthat::test_file("briefs/vers-nemeton/tests/test-numerotation.R")); stopifnot(sum(r$failed) == 0, !any(r$error))'
      - name: Intégration nemeton (GeoPackage d'exemple)
        run: NEMETON_SRC=$PWD/nemeton-src GROMA_RACINE=$PWD Rscript -e 'r <- as.data.frame(testthat::test_file("briefs/vers-nemeton/tests/test-integration-gpkg.R")); stopifnot(sum(r$failed) == 0, !any(r$error))'
