name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            server/pyproject.toml
      - run: pip install -e "core[dev]" -e "server[dev]"
      - run: pytest core server benchmark

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
      - run: gradle :groma-core:test
        working-directory: android

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: groma-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pobsteta/nemeton
          path: nemeton-src
      - uses: r-lib/actions/setup-r@v2
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sf, any::jsonlite, any::testthat, any::cli, any::rlang
      - name: Numérotation (cas communs)
        run: GROMA_FIXTURES=$PWD/fixtures/numerotation Rscript -e 'source("briefs/vers-nemeton/R/numerotation.R"); r <- as.data.frame(testthat::test_file("briefs/vers-nemeton/tests/test-numerotation.R")); stopifnot(sum(r$failed) == 0, !any(r$error))'
      - name: Intégration nemeton (GeoPackage d'exemple)
        run: NEMETON_SRC=$PWD/nemeton-src GROMA_RACINE=$PWD Rscript -e 'r <- as.data.frame(testthat::test_file("briefs/vers-nemeton/tests/test-integration-gpkg.R")); stopifnot(sum(r$failed) == 0, !any(r$error))'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
